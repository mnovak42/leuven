# Builds CUDA-enabled code only.
# GitHub-hosted runners do not provide an NVIDIA GPU, so this should not run CUDA device tests.
name: CUDA-ubuntu-build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'

jobs:
  build:
    name: ubuntu-22.04-cuda-${{ matrix.cuda }}-gcc-${{ matrix.gcc }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.2.0"
            gcc: 11
            cc: gcc-11
            cxx: g++-11
            fc: gfortran-11

          - cuda: "12.3.2"
            gcc: 12
            cc: gcc-12
            cxx: g++-12
            fc: gfortran-12

    env:
      build_dir: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libblas-dev \
            liblapack-dev \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }} \
            ${{ matrix.fc }}

          echo "CC=/usr/bin/${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/${{ matrix.cxx }}" >> $GITHUB_ENV
          echo "FC=/usr/bin/${{ matrix.fc }}" >> $GITHUB_ENV
          echo "CUDAHOSTCXX=/usr/bin/${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas-dev"]'

      - name: Show toolchain
        run: |
          which cmake
          cmake --version
          which nvcc
          nvcc --version
          ${CC} --version
          ${CXX} --version
          ${FC} --version

      - name: Configure Debug
        id: configure_debug
        run: |
          cmake -B ${{ env.build_dir }} -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_CUBLAS=ON \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DCMAKE_Fortran_COMPILER=${FC} \
            -DCMAKE_CUDA_HOST_COMPILER=${CUDAHOSTCXX}

      - name: Configure Error Processing
        if: ${{ failure() && steps.configure_debug.outcome == 'failure' }}
        working-directory: ${{ env.build_dir }}
        run: |
          if [[ -f "CMakeFiles/CMakeOutput.log" ]]; then
            echo "---- CMakeFiles/CMakeOutput.log"
            cat CMakeFiles/CMakeOutput.log
            echo "----"
          fi
          if [[ -f "CMakeFiles/CMakeError.log" ]]; then
            echo "---- CMakeFiles/CMakeError.log"
            cat CMakeFiles/CMakeError.log
            echo "----"
          fi

      - name: Build Debug
        run: cmake --build ${{ env.build_dir }} --parallel --verbose
