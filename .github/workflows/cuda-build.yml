# builds only since there is no device
name: CUDA-ubuntu-build

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cuda: "12.2.0"
            gcc: 11

          - os: ubuntu-22.04
            cuda: "12.3.2"
            gcc: 12

    env:
      build_dir: "build"

    steps:
    - uses: actions/checkout@v4

    - name: Install CUDA
      env:
        cuda: ${{ matrix.cuda }}
      run: |
        source ./testing/scripts/actions/install_cuda_ubuntu.sh
        if [[ $? -eq 0 ]]; then
          echo "Adding CUDA to CUDA_PATH, PATH and LD_LIBRARY_PATH"
          echo "CUDA_PATH=${CUDA_PATH}" >> $GITHUB_ENV
          echo "${CUDA_PATH}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${CUDA_PATH}/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Install/Select gcc and g++
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-${{ matrix.gcc }} \
          g++-${{ matrix.gcc }} \
          gfortran-${{ matrix.gcc }} \
          libblas-dev \
          liblapack-dev

        echo "CC=/usr/bin/gcc-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "FC=/usr/bin/gfortran-${{ matrix.gcc }}" >> $GITHUB_ENV
        echo "CUDAHOSTCXX=/usr/bin/g++-${{ matrix.gcc }}" >> $GITHUB_ENV

    - name: Configure cmake (Debug)
      id: configure
      run: cmake . -B ${{ env.build_dir }} -DCMAKE_BUILD_TYPE=Debug -DUSE_CUBLAS=ON -DBUILD_TESTS=ON

    - name: Configure Error Processing
      if: ${{ failure() && steps.configure.outcome == 'failure' }}
      working-directory: ${{ env.build_dir }}
      run: |
          if [[ -f "CMakeFiles/CMakeOutput.log" ]]; then
            echo "---- CMakeFiles/CMakeOutput.log"
            cat CMakeFiles/CMakeOutput.log
            echo "----"
          fi
          if [[ -f "CMakeFiles/CMakeError.log" ]]; then
            echo "---- CMakeFiles/CMakeError.log"
            cat CMakeFiles/CMakeError.log
            echo "----"
          fi

    - name: Build (Debug)
      working-directory: ${{ env.build_dir }}
      run: cmake --build . --target all --verbose -j `nproc`
