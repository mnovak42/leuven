name: cpu-build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-gcc-11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            fc: gfortran-11
            blas_args: ""

          - name: ubuntu-22.04-gcc-12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            fc: gfortran-12
            blas_args: ""

          - name: macos-15-clang
            os: macos-15
            cc: clang
            cxx: clang++
            fc: gfortran
            blas_args: "-DBLAS_LIBRARIES=/opt/homebrew/opt/openblas/lib/libopenblas.dylib -DLAPACK_LIBRARIES=/opt/homebrew/opt/openblas/lib/libopenblas.dylib"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libblas-dev \
            liblapack-dev \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }} \
            ${{ matrix.fc }}

      - name: Install dependencies macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openblas gcc || true
          echo "FC=$(brew --prefix gcc)/bin/gfortran" >> $GITHUB_ENV

      - name: Configure Debug
        run: |
          cmake -B build-debug -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ env.FC || matrix.fc }} \
            ${{ matrix.blas_args }}

      - name: Build Debug
        run: cmake --build build-debug --parallel

      - name: Test Debug
        run: ctest --test-dir build-debug -j2 --verbose --output-on-failure

      - name: Configure Release
        run: |
          cmake -B build-release -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ env.FC || matrix.fc }} \
            ${{ matrix.blas_args }}

      - name: Build Release
        run: cmake --build build-release --parallel

      - name: Test Release
        run: ctest --test-dir build-release -j2 --verbose --output-on-failure
