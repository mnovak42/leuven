name: cpu-build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'apps/examples/KSC/docs/**'
      - '*.yml'

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-gcc-11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11

          - name: ubuntu-22.04-gcc-12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12

          - name: ubuntu-24.04-gcc-13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13

          - name: macos-14-clang
            os: macos-14
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja || true

      - name: Configure Debug
        run: |
          cmake -B build-debug -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build Debug
        run: cmake --build build-debug --parallel

      - name: Test Debug
        run: ctest --test-dir build-debug -j2 --verbose --output-on-failure

      - name: Configure Release
        run: |
          cmake -B build-release -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build Release
        run: cmake --build build-release --parallel

      - name: Test Release
        run: ctest --test-dir build-release -j2 --verbose --output-on-failure
